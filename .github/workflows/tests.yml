name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache NPM
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-sail-node-${{ hashFiles('composer.lock', 'package-lock.json') }}

      - name: Cache Composer
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-sail-php-${{ hashFiles('composer.lock') }}

      - name: Bootstrap Sail
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/app" -w /app composer:2 install --ignore-platform-reqs --no-scripts --no-interaction --prefer-dist
          cp .env.example .env
          cat >> .env <<'EOF'
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=laravel
          DB_USERNAME=sail
          DB_PASSWORD=password
          EOF
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"

      - name: Cache Sail image
        id: sail-image
        uses: actions/cache@v6
        with:
          path: /tmp/sail-image.tar
          key: ${{ runner.os }}-sail-image-${{ env.WWWGROUP }}-${{ hashFiles('compose.yaml', 'composer.lock') }}

      - name: Restore Sail image
        if: steps.sail-image.outputs.cache-hit == 'true'
        run: docker load --input /tmp/sail-image.tar

      - name: Build and cache Sail image
        if: steps.sail-image.outputs.cache-hit != 'true'
        run: |
          vendor/bin/sail build laravel.test
          docker save sail-8.5/app --output /tmp/sail-image.tar

      - name: Start Sail and wait for MySQL
        run: vendor/bin/sail up -d --wait

      - name: Setup Application
        run: vendor/bin/sail composer setup

      - name: Run NPM checks
        run: vendor/bin/sail npm run check

      - name: Run NPM type checks
        run: vendor/bin/sail npm run types:check

      - name: Run Composer Lint
        run: vendor/bin/sail composer lint:check

      - name: Run Composer Type-Check
        run: vendor/bin/sail composer types:check

      - name: Run Artisan Tests
        run: vendor/bin/sail artisan test --parallel

  dependabot-auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

